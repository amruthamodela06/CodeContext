[project]
name = "codecontext-backend"
version = "0.1.0"
description = "CodeContext backend — repo ingestion and Q&A API."
requires-python = ">=3.12"
readme = "README.md"

# Dependency justifications (per CLAUDE.md):
#   fastapi              — web framework (PRD §9)
#   uvicorn[standard]    — ASGI server with httptools + websockets
#   sqlalchemy[asyncio]  — ORM with native 2.0-style async support
#   asyncpg              — async Postgres driver SQLAlchemy uses
#   pydantic             — validation + serialization (request/response schemas)
#   pydantic-settings    — env-based config via .env (12-factor)
#   alembic              — schema migrations (ADR-0001)
#   tree-sitter-language-pack — AST grammars for Python (ADR-0008); stubs for
#                          TS/JS/Go/Rust ship in the same package. Pre-built
#                          cp310-abi3 wheels work on Python 3.14.
#   pgvector             — SQLAlchemy Vector type + asyncpg adapter (ADR-0009)
#   sentence-transformers — bge-small-en-v1.5 embedder, CPU (ADR-0009). torch
#                          2.12 has a cp314 win wheel.
#   openai               — uniform transport for the OpenAI-compatible endpoints
#                          of Gemini and Ollama (ADR-0007 + 0010); no per-provider
#                          HTTP clients.
#   sse-starlette        — Server-Sent Events response for streaming /query tokens.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "alembic>=1.13",
    "tree-sitter-language-pack>=1.8.1",
    "pgvector>=0.4.2",
    "sentence-transformers>=5.5.1",
    "openai>=1.40",
    "sse-starlette>=2.1",
]

# Dev dependencies (PEP 735 dependency-groups, the modern uv-recommended form).
#   pytest           — test runner
#   pytest-asyncio   — async test support
#   httpx            — AsyncClient used to drive FastAPI in tests
#   ruff             — lint + format
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

# This project is a runnable application, not a library — don't try to build it
# as a wheel during `uv sync`. We still get a managed venv with deps installed.
[tool.uv]
package = false

# --- Ruff (lint + format) ---
[tool.ruff]
target-version = "py312"
line-length = 100
# Test fixtures hold intentionally-malformed source and tree data; ruff
# would (correctly) refuse to parse them.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# E/F : pycodestyle + pyflakes (baseline)
# I   : isort (import order)
# B   : flake8-bugbear (likely-bug patterns)
# UP  : pyupgrade (modern Python idioms)
# N   : pep8-naming
# SIM : flake8-simplify
# RUF : ruff-specific lints
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

# --- Pytest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
